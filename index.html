<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工具</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-shell">
        <span id="app-status" class="app-status" aria-live="polite"></span>
        <main class="content">
            <section id="time-tab" class="tab-content active">
                <div class="now-bar">
                    <select class="tool-select" aria-label="工具">
                        <option value="time" selected>◷ 时间</option>
                        <option value="json">{ } JSON</option>
                    </select>
                    <strong id="current-timestamp">--</strong><button class="icon-btn copy-btn" data-copy-target="current-timestamp" title="复制" aria-label="复制时间戳" type="button">⧉</button>
                </div>
                <section class="time-panel">
                    <div class="time-entry">
                        <button id="time-direction-btn" class="mode-btn" type="button" title="切换转换方向" aria-label="时间戳转日期，点击切换方向">时间戳 <span id="time-direction-arrow">→</span> 日期</button>
                        <input id="time-input" type="text" aria-label="待转换的时间" placeholder="时间戳" autocomplete="off" spellcheck="false">
                        <label class="timezone-control"><select id="time-timezone" aria-label="时区"></select></label>
                        <button id="convert-time-btn" class="primary-btn" type="button">转换</button>
                    </div>
                    <div id="time-error" class="inline-error" role="alert" aria-live="polite"></div>
                </section>
                <section class="history-section"><div class="history-table-wrap"><table class="history-table"><thead><tr><th>输入</th><th>时区</th><th>时间戳</th><th>日期</th><th class="history-actions"><button id="clear-history-btn" class="quiet-btn danger" type="button">清空</button></th></tr></thead><tbody id="history-body"></tbody></table></div></section>
            </section>
            <section id="json-tab" class="tab-content">
                <section class="json-panel">
                    <div class="json-toolbar" role="toolbar" aria-label="JSON 操作">
                        <select class="tool-select" aria-label="工具">
                            <option value="time" selected>◷ 时间</option>
                            <option value="json">{ } JSON</option>
                        </select>
                        <div class="json-actions"><button class="tool-btn accent" data-json-action="format" type="button">格式化</button><button class="tool-btn" data-json-action="compact" type="button">压缩</button><button class="tool-btn" data-json-action="copy" type="button">复制</button><span class="toolbar-divider"></span><button class="tool-btn" data-json-action="escape" type="button">转义</button><button class="tool-btn" data-json-action="unescape" type="button">去转义</button><button class="tool-btn" data-json-action="clear" type="button">清空</button></div>
                        <span class="toolbar-spacer"></span><div id="json-message" class="json-message" aria-live="polite"></div><div class="json-search"><span>⌕</span><input id="json-search-input" type="search" placeholder="查找"><span id="json-search-count"></span></div>
                    </div>
                    <div class="json-workspace">
                        <div class="json-editor-pane">
                            <div class="pane-label"><span>输入</span><div class="preview-actions"><span id="json-line-count">第 1 行</span><button id="toggle-json-preview-btn" class="tool-btn" type="button" aria-expanded="false" aria-controls="json-preview">展开视图</button></div></div>
                            <textarea id="json-input" aria-label="JSON 输入" spellcheck="false" wrap="off" placeholder="粘贴 JSON"></textarea>
                        </div>
                        <div id="json-preview" class="json-preview-pane" hidden>
                            <div class="pane-label"><span>视图</span><div class="preview-actions"><button id="expand-json-btn" class="mini-btn" type="button">展开</button><button id="collapse-json-btn" class="mini-btn" type="button">收缩</button></div></div>
                            <div id="json-tree" class="json-tree"></div>
                        </div>
                    </div>
                </section>
                <span id="json-validity" class="validity neutral" hidden></span><span id="json-stats" hidden></span>
            </section>
        </main>
    </div>
    <script type="module" src="/main.js"></script>
</body>
</html>
