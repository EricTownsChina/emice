<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工具</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-shell">
        <header class="app-header">
            <nav class="tabs" aria-label="工具切换">
                <button class="tab active" data-tab="time" type="button">时间</button>
                <button class="tab" data-tab="json" type="button">JSON</button>
            </nav>
            <span id="app-status" class="app-status" aria-live="polite"></span>
        </header>
        <main class="content">
            <section id="time-tab" class="tab-content active">
                <div class="now-bar"><span>现在</span><strong id="current-timestamp">--</strong><button class="icon-btn copy-btn" data-copy-target="current-timestamp" title="复制" type="button">⧉</button></div>
                <section class="time-panel">
                    <div class="panel-toolbar"><div class="mode-switch" role="group" aria-label="转换方向"><button class="mode-btn active" data-mode="timestamp" type="button">戳 → 日期</button><button class="mode-btn" data-mode="datetime" type="button">日期 → 戳</button></div><label class="timezone-control"><select id="time-timezone" aria-label="时区"></select></label></div>
                    <div class="time-entry"><textarea id="time-input" rows="3" placeholder="每行一条时间戳"></textarea><div class="entry-actions"><span id="time-input-hint">一行一条</span><button id="convert-time-btn" class="primary-btn" type="button">转换</button></div></div>
                    <div id="time-error" class="inline-error" role="alert" aria-live="polite"></div>
                </section>
                <section class="history-section"><div class="section-heading"><h2>记录 <span id="history-count">0</span></h2><div class="section-actions"><button id="fill-now-btn" class="quiet-btn" type="button">现在</button><button id="clear-history-btn" class="quiet-btn danger" type="button">清空</button></div></div><div class="history-table-wrap"><table class="history-table"><thead><tr><th>输入</th><th>时区</th><th>时间戳</th><th>日期</th><th>差值</th><th></th></tr></thead><tbody id="history-body"></tbody></table><div id="history-empty" class="empty-state"><p>暂无记录</p></div></div></section>
            </section>
            <section id="json-tab" class="tab-content">
                <section class="json-panel">
                    <div class="json-toolbar" role="toolbar" aria-label="JSON 操作"><button class="tool-btn accent" data-json-action="format" type="button">格式化</button><button class="tool-btn" data-json-action="compact" type="button">压缩</button><button class="tool-btn" data-json-action="copy" type="button">复制</button><span class="toolbar-divider"></span><button class="tool-btn" data-json-action="escape" type="button">转义</button><button class="tool-btn" data-json-action="unescape" type="button">去转义</button><button class="tool-btn" data-json-action="clear" type="button">清空</button><span class="toolbar-spacer"></span><button class="tool-btn" data-json-action="sample" type="button">示例</button></div>
                    <div class="json-workspace"><div class="json-editor-pane"><div class="pane-label"><span>输入</span><span id="json-line-count">第 1 行</span></div><textarea id="json-input" spellcheck="false" wrap="off" placeholder="粘贴 JSON"></textarea></div><div class="json-preview-pane"><div class="pane-label"><span>视图</span><div class="preview-actions"><button id="expand-json-btn" class="mini-btn" type="button">展开</button><button id="collapse-json-btn" class="mini-btn" type="button">收缩</button></div></div><div id="json-tree" class="json-tree"><div class="tree-placeholder">—</div></div></div></div>
                    <div class="json-footer"><div class="json-search"><span>⌕</span><input id="json-search-input" type="search" placeholder="查找"><span id="json-search-count"></span></div><div id="json-message" class="json-message" aria-live="polite"></div></div>
                </section>
                <span id="json-validity" class="validity neutral" hidden></span><span id="json-stats" hidden></span>
            </section>
        </main>
    </div>
    <script type="module" src="/main.js"></script>
</body>
</html>
